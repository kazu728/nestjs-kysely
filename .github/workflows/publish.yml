name: release
on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # npm refuses to publish a prerelease, or a version below the current latest, without an explicit dist-tag.
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          major=${version%%.*}
          latest_major=$(npm view nestjs-kysely dist-tags.latest | cut -d. -f1)
          if [[ $version == *-* ]]; then
            tag=next
          elif (( major < latest_major )); then
            tag=latest-$major
          else
            tag=latest
          fi
          npm publish --tag "$tag"
